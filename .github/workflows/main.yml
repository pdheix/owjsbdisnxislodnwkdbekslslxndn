name: 📥 دانلود، تبدیل به MP4 و انتشار در Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '🔗 لینک مستقیم فایل برای دانلود'
        required: true
        type: string
      convert_to_mp4:
        description: '🎬 تبدیل ویدیو به MP4؟ (در صورت خاموش بودن، فایل اصلی ریلیز می‌شود)'
        required: true
        type: boolean
        default: true
      tag_name:
        description: '🏷️ تگ ریلیز (اختیاری — اگر خالی باشد خودکار ساخته می‌شود)'
        required: false
        type: string
        default: ''

jobs:
  download-convert-release:
    name: دانلود، تبدیل و انتشار
    runs-on: ubuntu-latest
    permissions:
      contents: write   # برای ساخت ریلیز و آپلود فایل لازم است

    steps:
      - name: 📥 دانلود فایل با نمایش نوار پیشرفت و درصد
        run: |
          set -e

          URL="${{ inputs.download_url }}"
          # حذف query string از انتهای لینک و استخراج نام فایل
          FILENAME="$(basename "${URL%%\?*}")"
          [ -z "$FILENAME" ] && FILENAME="downloaded_file"
